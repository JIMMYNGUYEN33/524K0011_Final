<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Accounts - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="admin_style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <header class="h-16 bg-indigo-600 flex items-center justify-between px-6 shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-2 text-white">
            <i class="fa-solid fa-shield-halved text-xl"></i>
            <span class="text-xl font-bold">BeePay</span>
        </div>
        <div class="flex items-center gap-6 text-white">
            <div class="text-right">
                <div class="text-sm opacity-90">Administrator</div>
                <div class="text-sm font-semibold">System Administrator</div>
            </div>
            <button class="btn-logout flex items-center gap-2 px-3 py-1.5 rounded">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">

        <aside class="w-64 bg-white shadow-md flex flex-col overflow-y-auto z-0">
            <nav class="flex-1 py-4">
                <ul class="space-y-1">
                    <li>
                        <a href="AdminDashboard.html" class="menu-item flex items-center gap-3 px-6 py-3 text-gray-600">
                            <i class="fa-solid fa-house"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="AdminPending.html" class="menu-item flex items-center gap-3 px-6 py-3 text-gray-600">
                            <i class="fa-regular fa-clock"></i> Pending Accounts
                        </a>
                    </li>
                    <li>
                        <a href="AdminVerified.html"
                            class="menu-item flex items-center gap-3 px-6 py-3 bg-indigo-50 text-indigo-600 font-medium">
                            <i class="fa-regular fa-user"></i> Verified Accounts
                        </a>
                    </li>
                    <li>
                        <a href="AdminDisabled.html" class="menu-item flex items-center gap-3 px-6 py-3 text-gray-600">
                            <i class="fa-solid fa-user-xmark"></i> Disabled Accounts
                        </a>
                    </li>
                    <li>
                        <a href="AdminLocked.html" class="menu-item flex items-center gap-3 px-6 py-3 text-gray-600">
                            <i class="fa-solid fa-lock"></i> Locked Accounts
                        </a>
                    </li>
                    <li>
                        <a href="AdminTransactions.html"
                            class="menu-item flex items-center gap-3 px-6 py-3 text-gray-600">
                            <i class="fa-solid fa-users"></i> Pending Transactions
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">

            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Verified Accounts</h1>
                <p class="text-gray-500 mt-1">Active verified accounts (1)</p>
            </div>

            <div class="flex flex-col gap-4">

                <a href="AdVerifiedDetail.html"
                    class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex items-center justify-between cursor-pointer hover:shadow-md hover:border-indigo-200 transition-all duration-200 group block">

                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-xl">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-900 group-hover:text-indigo-600 transition-colors">Phan
                                Nguyễn Thảo Như</h4>
                            <div class="flex items-center gap-2 text-sm text-gray-500 mt-1">
                                <span>bee@gmail.com</span>
                                <span>•</span>
                                <span>0123456789</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-6">
                        <div class="text-right">
                            <div class="text-sm font-bold text-gray-900 mb-1.5">10.000.000 VND</div>
                            <span
                                class="inline-flex items-center gap-1 bg-green-100 text-green-700 text-xs font-semibold px-2.5 py-1 rounded-full">
                                <i class="fa-solid fa-user-check"></i> Verified
                            </span>
                        </div>
                        <i
                            class="fa-solid fa-chevron-right text-gray-300 group-hover:text-indigo-500 transition-colors"></i>
                    </div>

                </a>
            </div>

        </main>
    </div>

</body>

</html>
