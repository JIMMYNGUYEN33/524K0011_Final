<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeePay - Transfer Money</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style_transfer.css">
</head>
<body>
    <div class="app-container">
        <header class="app-top-bar">
            <a href="Home.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            
            <div class="page-title-group">
                <h1 class="page-title">Transfer Money</h1>
                <p class="page-subtitle">Send money instantly to another BeePay wallet</p>
            </div>
        </header>

        <div class="transfer-card">
            <form action="Home.html" method="GET">
                
                <div class="in_gr">
                    <label>Receiver's Phone / Email <span class="required">*</span></label>
                    <div class="in_wrapper">
                        <i class="fa-solid fa-user-pen"></i>
                        <input required type="text" name="receiver" placeholder="Enter phone number or email">
                    </div>
                </div>

                <div class="in_gr">
                    <label>Amount (VND) <span class="required">*</span></label>
                    <div class="in_wrapper">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <input required type="number" name="amount" min="1000" placeholder="Enter amount to transfer">
                    </div>
                </div>

                <div class="in_gr">
                    <label>Note</label>
                    <div class="in_wrapper">
                        <i class="fa-regular fa-comment-dots" style="top: 25px;"></i>
                        <textarea name="note" rows="3" class="note-textarea" placeholder="Optional message for receiver"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-transfer">Transfer</button>
            </form>
        </div>
    </div>
</body>
</html>
