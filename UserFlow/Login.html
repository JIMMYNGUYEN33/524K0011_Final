<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeePay</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style ="text-align: center; color: aliceblue; margin-top: 30px;">BeePay</h1>
    <p style="text-align: center; color: aliceblue;">Secure digital payment solution</p>
    <div class = "Login-card">
        <form >
            <h2> Sign In</h2>
            <div class="in_gr">
                <label>Email or Phone Number</label>
                <div class="in_wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input required type ="text" placeholder ="Enter email or phone">
                </div>
            </div>
            <div class="in_gr">
                <label>PassWord</label>
                <div class="in_wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input required type = "text" placeholder="Enter password">
                </div>
            </div>
            <div class="options">
                <label><input type ="checkbox">Remember Me</label>
                <a href="Forgot.html">Forgot password ?</a>

            </div>
            <a href="Home.html" style="text-decoration: none;">
                <button type="button" class="btn-signin">Sign In</button>
            </a>
        </form>
        <p style = "text-align: center;">Don't have an account? <a href="Register.html">Register now</a> </p>

    </div>

</body>
</html>
