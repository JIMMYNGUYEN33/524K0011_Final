<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeePay - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style_register.css">
</head>
<body>
    <div class="app-container">
        <div class="back-navigation">
            <a href="Login.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>

        <h1 class="brand-title">BeePay</h1>
        <p class="brand-subtitle">Secure digital payment solution</p>

        <div class="Register-card">
            <form action="Login.html" method="POST">
                <h2>Create Account</h2>
                
                <div class="in_gr">
                    <label>Full Name</label>
                    <div class="in_wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input required type="text" placeholder="Enter your full name">
                    </div>
                </div>

                <div class="in_gr">
                    <label>Birthday</label>
                    <div class="in_wrapper">
                        <i class="fa-regular fa-calendar"></i>
                        <input required type="date" placeholder="Select your birthdate">
                    </div>
                </div>

                <div class="in_gr">
                    <label>Email Address</label>
                    <div class="in_wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input required type="email" placeholder="Enter your email">
                    </div>
                </div>

                <div class="in_gr">
                    <label>Phone Number</label>
                    <div class="in_wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input required type="tel" placeholder="Enter your phone number">
                    </div>
                </div>

                <div class="id-verification-section">
                    <h3 class="verification-title">ID Verification</h3>
                    <div class="upload-box" id="upload-front">
                        <input type="file" id="file-front" name="id_front" accept="image/*" required hidden>
                        <div class="upload-content">
                            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                            <p class="upload-text">Upload ID Card - Front Side</p>
                            <span class="upload-hint">PNG, JPG up to 5MB</span>
                        </div>
                    </div>

                    <div class="upload-box mt-3" id="upload-back">
                        <input type="file" id="file-back" name="id_back" accept="image/*" required hidden>
                        <div class="upload-content">
                            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                            <p class="upload-text">Upload ID Card - Back Side</p>
                            <span class="upload-hint">PNG, JPG up to 5MB</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-register">Register</button>
            </form>

            <p class="signin-text">
                Already have an account? <a href="Login.html">Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
