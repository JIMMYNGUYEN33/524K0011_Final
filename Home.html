<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style_home.css">
    <title>Bee-Home</title>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="user-info">
                <p>Welcome Back,</p>
                <h2>Phan Nguyễn Thảo Như</h2>
            </div>
            <button class="btn-notification"><i class="fa-regular fa-bell"></i></button>
        </header>
        <div class="balance-card">
            <div class="card-top">
                <div class="wallet-icon"><i class="fa-solid fa-wallet"></i></div>
                <div class="balance-info">
                    <p>Wallet Balance</p>
                    <span>01234567</span>
                </div>
                <button class="btn-eye"><i class="fa-regular fa-eye"></i></button>
            </div>
            <h1 class="amount">10,000,000 VND</h1>
        </div>
        <div class="services-section">
            <h3 class="section-title">Services</h3>
            <div class="services-grid">
                <a href="Deposit.html" class="service-item-link">
                    <div class="service-item">
                        <div class="icon-box green"><i class="fa-solid fa-download"></i></div>
                        <p>Deposit</p>
                    </div>
                </a>

                <a href="Withdraw.html" class="service-item-link">
                    <div class="service-item">
                        <div class="icon-box blue"><i class="fa-solid fa-upload"></i></div>
                        <p>Withdraw</p>
                    </div>
                </a>

                <a href="Transfer.html" class="service-item-link">
                    <div class="service-item">
                        <div class="icon-box purple"><i class="fa-solid fa-exchange-alt"></i></div>
                        <p>Transfer</p>
                    </div>
                </a>

                <a href="BuyCard.html" class="service-item-link">
                    <div class="service-item">
                        <div class="icon-box orange"><i class="fa-solid fa-mobile-screen"></i></div>
                        <p>Buy Card</p>
                    </div>
                </a>

                <a href="History.html" class="service-item-link">
                    <div class="service-item">
                        <div class="icon-box indigo"><i class="fa-solid fa-history"></i></div>
                        <p>History</p>
                    </div>
                </a>
            </div>
            <h3 class="section-title">Recent Transaction</h3>
            <div class="empty-state">
                <i class="fa-solid fa-wallet"></i>
                <p>No transactions yet</p>
            </div>
        </div>
        
        <div class="bottom-nav">
            <nav class="bottom-nav">
                <a href="Home.html" class="nav-item active">
                    <i class="fa-solid fa-house"></i>
                    <span>BeePay</span>
                </a>
                <a href="Scan.html" class="nav-item scan-btn">
                    <div class="scan-circle">
                         <i class="fa-solid fa-qrcode"></i>
                     </div>
                    <span>Scan</span>
                </a>
                <a href="Profile.html" class="nav-item">
                     <i class="fa-regular fa-user"></i>
                    <span>Profile</span>
                </a>
            </nav>
        </div>
    </div>
</body>
</html>
